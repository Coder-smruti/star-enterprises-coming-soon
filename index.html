<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Star Enterprises - Our new website is coming soon.">
  <title>Star Enterprises | Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07111f;
      --card: rgba(255,255,255,.07);
      --text: #ffffff;
      --muted: #aeb9c8;
      --accent: #f5c542;
      --accent-2: #ffdf70;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .18;
      pointer-events: none;
    }

    body::before {
      background: var(--accent);
      top: -180px;
      left: -120px;
    }

    body::after {
      background: #2764ff;
      right: -180px;
      bottom: -180px;
    }

    .wrap {
      width: min(920px, 92%);
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 24px;
    }

    .logo-mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 24px;
      border: 2px solid rgba(245,197,66,.65);
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 800;
      color: var(--accent);
      background: rgba(245,197,66,.08);
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    .brand {
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .brand span { color: var(--accent); }

    .eyebrow {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid rgba(245,197,66,.35);
      border-radius: 999px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      background: rgba(245,197,66,.06);
    }

    h1 {
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1.05;
      letter-spacing: -2.5px;
      margin-bottom: 22px;
    }

    .lead {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 19px);
      line-height: 1.7;
    }

    .card {
      margin: 38px auto 0;
      max-width: 600px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(14px);
    }

    .contact {
      color: #dce3ed;
      font-size: 15px;
      line-height: 1.7;
    }

    .contact strong { color: var(--accent); }

    footer {
      margin-top: 36px;
      color: #718096;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .wrap { padding: 34px 16px; }
      .logo-mark { width: 68px; height: 68px; border-radius: 18px; }
      .brand { letter-spacing: -1.5px; }
      h1 { letter-spacing: -1.5px; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo-mark">★</div>

    <div class="brand">STAR <span>ENTERPRISES</span></div>

    <div class="eyebrow">Website Coming Soon</div>

    <h1>Something great is on the way.</h1>

    <p class="lead">
      We are working on our new website and getting everything ready for you.
      Please check back soon.
    </p>

    <div class="card">
      <p class="contact">
        For enquiries, please contact <strong>Star Enterprises</strong> directly.
      </p>
    </div>

    <footer>
      © 2026 Star Enterprises. All rights reserved.
    </footer>
  </main>
</body>
</html>
